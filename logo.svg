<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<path id="button" d="M234 71.31 A186 169 0 0 1 278 71.31 L278 84 L271 91 L241 91 L234 84 Z" />
		<clipPath id="wh-dial">
			<circle cx="256" cy="256" r="200" />
		</clipPath>
	</defs>

	<!-- background-->
	<rect width="512" height="512" fill="#EADFC3" />

	<!-- buttons -->
	<g transform="translate(256 256) scale(1.29) translate(-256 -256)">
		<use href="#button" fill="#C0392B" />
		<use href="#button" fill="#1F1F1F" transform="rotate(-35 256 256)" />
		<use href="#button" fill="#1F1F1F" transform="rotate(35 256 256)" />
	</g>
	
	<!-- dial -->
	<circle cx="256" cy="256" r="214" fill="#BCC1C5" />
	<circle cx="256" cy="256" r="200" fill="#1F1F1F" />
	<circle cx="256" cy="256" r="196" fill="#EADFC3" />

	<!-- ticks -->
	<circle cx="256" cy="256" r="180" fill="none"
		stroke="#1F1F1F"
		stroke-width="15"
		stroke-dasharray="3.77 15.08"
		stroke-dashoffset="1.88" />
	<circle cx="256" cy="256" r="175" fill="none"
		stroke="#1F1F1F"
		stroke-width="25"
		stroke-dasharray="10.18 81.45"
		stroke-dashoffset="5.09" />

	<!-- shadow -->
	<!--<path d="M164.69 315.31 364.69 515.31 547.31 396.69 347.31 196.69" fill="#1F1F1F" opacity="0.3" clip-path="url(#wh-dial)" />-->
	<path d="M168.69 315.31 364.69 515.31 547.31 396.69 351.31 196.69" fill="#1F1F1F" opacity="0.3" clip-path="url(#wh-dial)" />
	
	<!-- briefcase -->
	<rect x="164" y="192" width="192" height="128" rx="16" fill="#1F1F1F" />
	<rect x="174" y="253" width="172" height="6" fill="#EADFC3" />
	<rect x="240" y="244" width="32" height="24" rx="5" fill="#BCC1C5" stroke="#1F1F1F" stroke-width="5" />
	<rect x="224" y="160" width="64" height="50" rx="12" fill="none" stroke="#1F1F1F" stroke-width="12"></rect>
</svg>