name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version = short commit hash on push, release tag on release.
      - name: Set version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = "release" ]; then
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Optional: sign with your own key so new versions can update older installs.
      # Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # Without them the APK is signed with a debug key and installs fine, but each build has a different key.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          VERSION: ${{ steps.version.outputs.name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease -PappVersion="$VERSION" -PappVersionCode=${{ github.run_number }} --stacktrace

      - name: Name the APK
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: cp app/build/outputs/apk/release/app-release.apk "WorkHours-$VERSION.apk"

      # Push: only keep the APK as a build artifact.
      - name: Upload APK as build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: WorkHours-${{ steps.version.outputs.name }}
          path: WorkHours-${{ steps.version.outputs.name }}.apk
          archive: false
          if-no-files-found: error

      # Release: attach the APK to the release that triggered the run.
      - name: Publish APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: gh release upload "$VERSION" "WorkHours-$VERSION.apk" --clobber --repo "${{ github.repository }}"